[package]
name = "herbert-chat"
version = "0.1.0"
edition = "2021"
authors = ["Philippe Anel <philippe@dremml.com>"]
license = "MIT"
description = "What every herbert engine shares about a model, not about its device: the chat template, the output of each family split into content, thinking and tool calls, the sampler, the streaming detokenization, the load's progress"

[dependencies]
# The keys of a tool's schema keep their order (Python's `json.dumps`) when the server turns on `serde_json/preserve_order`.
serde_json = "1.0"
tokenizers = { version = "0.22.2", default-features = false, features = ["fancy-regex"] }
minijinja = { version = "2", features = ["json", "builtins", "macros", "multi_template", "preserve_order"] }
minijinja-contrib = { version = "2", features = ["pycompat"] }

[dev-dependencies]
serde_json = { version = "1.0", features = ["preserve_order"] }
